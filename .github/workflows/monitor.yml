name: Monitor de Ingressos

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  check-tickets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Executar Script de Checagem
        env:
          WPP_PHONE: ${{ secrets.WPP_PHONE }}
          WPP_API_KEY: ${{ secrets.WPP_API_KEY }}
        run: node monitor.js